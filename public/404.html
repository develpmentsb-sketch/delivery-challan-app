<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Delivery Challan & E-Way Bill Dashboard</title>
    <!--
      GitHub Pages has no server-side rewrite rule, so a hard refresh or a
      direct link to any inner route (e.g. /delivery-challan-app/master-list)
      has no matching file and 404s. This page catches that 404, stashes the
      intended path, and bounces to index.html - which then restores the
      real URL before React Router takes over. See:
      https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      var segmentCount = 1 // matches the repo name segment: /delivery-challan-app/
      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
  </head>
  <body></body>
</html>
